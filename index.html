<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>LoRD Academy - المنصة الشاملة</title>
    <style>
        :root {
            --bg-color: #050505;
            --card-bg: #111827;
            --primary-gold: #fbbf24;
            --secondary-gold: #d97706;
            --text-main: #f8fafc;
            --text-secondary: #94a3b8;
            --success: #22c55e;
            --error: #ef4444;
            --glow: 0 0 15px #fbbf24, 0 0 30px #d97706;
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: var(--bg-color);
            color: var(--text-main);
            margin: 0;
            padding: 0;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            overflow-x: hidden;
        }

        /* شاشة الاستقبال */
        #home-screen {
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
            text-align: center;
            padding: 20px;
            background: radial-gradient(circle at center, #1e1b4b 0%, #050505 100%);
        }

        .main-logo {
            font-size: clamp(3.5rem, 12vw, 7rem);
            font-weight: 900;
            color: var(--primary-gold);
            text-transform: uppercase;
            letter-spacing: 8px;
            margin-bottom: 0;
            filter: drop-shadow(var(--glow));
            animation: golden-pulse 2s infinite alternate;
        }

        @keyframes golden-pulse {
            from { text-shadow: 0 0 20px var(--glow-color); opacity: 0.9; }
            to { text-shadow: 0 0 40px var(--primary-gold), 0 0 70px var(--secondary-gold); opacity: 1; }
        }

        .academy-subtitle {
            font-size: 1.4rem;
            color: var(--text-secondary);
            margin-bottom: 60px;
            font-weight: 300;
            letter-spacing: 4px;
        }

        .menu-grid {
            display: grid;
            grid-template-columns: repeat(2, 1fr);
            gap: 25px;
            width: 100%;
            max-width: 700px;
        }

        .exam-card-btn {
            background: linear-gradient(145deg, #1f2937, #111827);
            border: 2px solid var(--primary-gold);
            color: var(--primary-gold);
            padding: 30px 20px;
            font-size: 1.4rem;
            font-weight: bold;
            border-radius: 20px;
            cursor: pointer;
            transition: all 0.4s cubic-bezier(0.175, 0.885, 0.32, 1.275);
            box-shadow: 0 10px 20px rgba(0,0,0,0.5);
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 10px;
        }

        .exam-card-btn span {
            font-size: 0.9rem;
            color: var(--text-secondary);
            font-weight: normal;
        }

        .exam-card-btn:hover {
            background: var(--primary-gold);
            color: #000;
            transform: scale(1.05);
            box-shadow: var(--glow);
        }

        .exam-card-btn:hover span {
            color: #333;
        }

        /* واجهة الاختبار */
        #quiz-screen {
            display: none;
            padding: 20px;
            max-width: 900px;
            margin: 0 auto;
            width: 100%;
            box-sizing: border-box;
        }

        .top-nav {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 20px 0;
            margin-bottom: 20px;
        }

        .back-home-btn {
            background: none;
            border: 1px solid var(--text-secondary);
            color: var(--text-secondary);
            padding: 10px 20px;
            border-radius: 10px;
            cursor: pointer;
            transition: 0.3s;
        }

        .back-home-btn:hover {
            border-color: var(--primary-gold);
            color: var(--primary-gold);
        }

        .quiz-container {
            background-color: var(--card-bg);
            border-radius: 25px;
            padding: 40px;
            box-shadow: 0 25px 50px -12px rgba(0, 0, 0, 0.5);
            border: 1px solid #374151;
        }

        .progress-container {
            height: 12px;
            background-color: #374151;
            border-radius: 6px;
            margin-bottom: 30px;
            overflow: hidden;
        }

        .progress-bar {
            height: 100%;
            background: linear-gradient(90deg, var(--secondary-gold), var(--primary-gold));
            width: 0%;
            transition: width 0.5s ease;
        }

        .q-meta {
            color: var(--primary-gold);
            font-weight: 600;
            font-size: 1.1rem;
            margin-bottom: 15px;
        }

        .q-text {
            font-size: 1.6rem;
            line-height: 1.6;
            margin-bottom: 35px;
            color: #fff;
        }

        .options-list {
            display: grid;
            gap: 15px;
        }

        .opt-btn {
            background-color: #1f2937;
            border: 2px solid transparent;
            color: var(--text-main);
            padding: 20px 25px;
            border-radius: 15px;
            cursor: pointer;
            font-size: 1.2rem;
            text-align: right;
            transition: all 0.2s;
        }

        .opt-btn:hover:not(:disabled) {
            background-color: #374151;
            border-color: var(--text-secondary);
        }

        .opt-btn.correct {
            background-color: var(--success) !important;
            border-color: #14532d;
            font-weight: bold;
        }

        .opt-btn.wrong {
            background-color: var(--error) !important;
            border-color: #7f1d1d;
        }

        .exp-box {
            margin-top: 25px;
            padding: 20px;
            background-color: #0a0a0a;
            border-right: 6px solid var(--primary-gold);
            display: none;
            border-radius: 0 12px 12px 0;
            color: #e2e8f0;
            line-height: 1.5;
        }

        #next-btn {
            margin-top: 35px;
            width: 100%;
            padding: 20px;
            background-color: var(--primary-gold);
            color: #000;
            border: none;
            border-radius: 15px;
            font-size: 1.3rem;
            font-weight: 800;
            cursor: pointer;
            display: none;
            box-shadow: 0 10px 15px -3px rgba(0,0,0,0.3);
        }

        /* النتائج */
        #result-screen {
            display: none;
            text-align: center;
        }

        .result-circle {
            width: 200px;
            height: 200px;
            border-radius: 50%;
            border: 10px solid var(--primary-gold);
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 3.5rem;
            margin: 40px auto;
            color: var(--primary-gold);
            box-shadow: var(--glow);
        }

        footer {
            margin-top: auto;
            padding: 40px;
            text-align: center;
            color: var(--text-secondary);
            font-size: 1rem;
            background-color: #000;
        }

        @media (max-width: 600px) {
            .menu-grid { grid-template-columns: 1fr; }
            .main-logo { font-size: 3.5rem; }
            .q-text { font-size: 1.3rem; }
            .quiz-container { padding: 20px; }
        }
    </style>
</head>
<body>

    <!-- الشاشة الرئيسية -->
    <div id="home-screen">
        <div class="main-logo">LoRD Academy</div>
        <div class="academy-subtitle"> إعداد: علي جلال</div>
        
        <div class="menu-grid">
            <button class="exam-card-btn" onclick="startQuiz('learning')">
                اختبار مادة التعلم
                <span>60 سؤالاً شاملاً</span>
            </button>
            <button class="exam-card-btn" onclick="startQuiz('pavlov')">
                نظرية بافلوف
                <span>الاشتراط الكلاسيكي - 60 سؤالاً</span>
            </button>
            <button class="exam-card-btn" onclick="startQuiz('thorndike')">
                نظرية ثورندايك
                <span>المحاولة والخطأ - 60 سؤالاً</span>
            </button>
            <button class="exam-card-btn" onclick="startQuiz('skinner')">
                نظرية سكينر
                <span>الاشتراط الإجرائي - 60 سؤالاً</span>
            </button>
        </div>
    </div>

    <!-- شاشة الاختبار -->
    <div id="quiz-screen">
        <div class="top-nav">
            <div id="quiz-title-display" style="font-size: 1.5rem; font-weight: bold; color: var(--primary-gold);"></div>
            <button class="back-home-btn" onclick="returnToHome()">الرئيسية</button>
        </div>

        <div id="quiz-ui" class="quiz-container">
            <div class="progress-container">
                <div class="progress-bar" id="bar"></div>
            </div>
            <div class="q-meta" id="q-count">سؤال 1 من 60</div>
            <div class="q-text" id="q-text">جاري تحميل السؤال...</div>
            <div class="options-list" id="options-box"></div>
            <div class="exp-box" id="exp-box"></div>
            <button id="next-btn" onclick="handleNext()">السؤال التالي ⮕</button>
        </div>

        <!-- شاشة النتيجة النهائية -->
        <div id="result-screen" class="quiz-container">
            <h2 style="color: var(--primary-gold); font-size: 2.5rem;">اكتمل الاختبار!</h2>
            <div class="result-circle" id="final-res">0/60</div>
            <p id="res-msg" style="font-size: 1.5rem; margin-bottom: 30px;"></p>
            <div style="display: flex; gap: 20px;">
                <button class="exam-card-btn" style="flex: 1; padding: 20px;" onclick="startQuiz(currentQuizKey)">إعادة الاختبار</button>
                <button class="exam-card-btn" style="flex: 1; padding: 20px; background: none;" onclick="returnToHome()">الرئيسية</button>
            </div>
        </div>
    </div>

    <footer>
        &copy; 2024 جميع الحقوق محفوظة لـ Lord Academy<br>
        إعداد وتطوير: علي جلال
    </footer>

    <script>

                    { q: "يعتبر سكينر أن أسلوب 'المحاضرة' غير فعال لأنه:", options: ["صعب جداً", "لا يتيح تعزيز الاستجابات الصحيحة فوراً", "ممل فقط", "يتطلب وقتاً"], correct: "لا يتيح تعزيز الاستجابات الصحيحة فوراً", exp: "المحاضرة تجعل الطالب سلبياً ولا توفر فرصة لممارسة السلوك وتلقي التعزيز." },

                    { q: "العقاب الذي يتضمن استبقاء التلاميذ بعد ميعاد الانصراف يسمى عقاباً:", options: ["من النوع الأول (إيجابي)", "من النوع الثاني (سلبي)", "تعزيزاً إيجابياً", "انطفاءً"], correct: "من النوع الثاني (سلبي)", exp: "لأنه يتضمن حرمان (استبعاد) الطالب من وقت الراحة أو العودة للمنزل (منبه محبب)." },

                    { q: "شرط الانتقال من خطوة لخطوة في التعليم المبرمج هو:", options: ["مرور الوقت", "إتقان الخطوة السابقة", "رغبة المعلم", "نهاية العام"], correct: "إتقان الخطوة السابقة", exp: "لا ينتقل المتعلم لخطوة أصعب إلا بعد التأكد من نجاحه في السابقة لضمان التعزيز." },
                    { q: "هدف سكينر من تجربة 'الحمامة والنقطة السوداء' هو إثبات مبدأ:", options: ["التعميم", "التشكيل (التقريب التتابعي)", "الوراثة", "التعب"], correct: "التشكيل (التقريب التتابعي)", exp: "أثبت كيف يمكن تعليم سلوك معقد (نقر نقطة معينة) عبر مراحل تعزيز متدرجة." },

                    { q: "الانطفاء في الاشتراط الإجرائي يحدث عند التوقف عن تقديم المعزز.", options: ["صح", "خطأ"], correct: "صح", exp: "غياب التعزيز يؤدي تدريجياً لتلاشي الاستجابة." },
                    { q: "التعزيز الجزئي (المتقطع) يؤدي إلى اكتساب أسرع للتعلم من التعزيز المستمر.", options: ["صح", "خطأ"], correct: "خطأ", exp: "المستمر أسرع في الاكتساب، لكن المتقطع أقوى في الاستبقاء." },
                    { q: "التشكيل يستخدم لتعليم الاستجابات المعقدة التي لا تصدر عن المتعلم تلقائياً.", options: ["صح", "خطأ"], correct: "صح", exp: "عبر تعزيز الخطوات البسيطة المؤدية للسلوك المعقد." },
                    { q: "يرى سكينر أن العقاب هو الوسيلة الأفضل لإلغاء السلوك السيء في الصف.", options: ["صح", "خطأ"], correct: "خطأ", exp: "سكينر نصح بتجنب العقاب واستخدام التجاهل (الانطفاء) أو التعزيز الإيجابي للبدائل." },
                    { q: "التغذية الراجعة تعتبر نوعاً من التعزيز في المواقف التعليمية.", options: ["صح", "خطأ"], correct: "صح", exp: "تزويد الطالب بنتيجة عمله يعزز الاستجابات الصحيحة." },
                    { q: "المدح والنجوم الذهبية تعتبر معززات أولية.", options: ["صح", "خطأ"], correct: "خطأ", exp: "هي معززات ثانوية (مكتسبة)." },
                    { q: "في جداول النسبة، يعتمد التعزيز على عدد الاستجابات التي يقوم بها الكائن.", options: ["صح", "خطأ"], correct: "صح", exp: "مثل تعزيز الطالب بعد كل ٥ مسائل صحيحة." },
                    { q: "الضرب والصدمة الكهربائية تعتبر معاقبات ثانوية.", options: ["صح", "خطأ"], correct: "خطأ", exp: "هي معاقبات أولية (فطرية التأثير)." },
                    { q: "يرتبط الانطفاء في الاشتراط الإجرائي بإنهاء المثير الشرطي.", options: ["صح", "خطأ"], correct: "خطأ", exp: "يرتبط بإنهاء (سحب) التعزيز." },
                    { q: "التعليم المبرمج يتيح لكل متعلم السير حسب سرعته الخاصة.", options: ["صح", "خطأ"], correct: "صح", exp: "هذا من أهم مميزات التعليم المبرمج القائم على نموذج سكينر." },
                    { q: "أثر التعزيز الجزئي يعني أن الاستجابة تكون أكثر مقاومة للانطفاء.", options: ["صح", "خطأ"], correct: "صح", exp: "لأن الكائن لا يتوقع التعزيز في كل مرة، فيستمر في المحاولة لفترة أطول." },
                    { q: "السلوك الذي يدعم (يعزز) يُتعلم، والسلوك الذي لا يدعم لا يُتعلم.", options: ["صح", "خطأ"], correct: "صح", exp: "هذا هو المبدأ الأساسي في نظرية سكينر." },
                    { q: "استخدام الابتسامات والإيماءات الإيجابية من المعلم يعتبر تعزيزاً إيجابياً.", options: ["صح", "خطأ"], correct: "صح", exp: "هي منبهات محببة تزيد من إقبال الطالب على التعلم." },
                    { q: "العقاب ينجح دائماً في استبعاد السلوك المكروه نهائياً.", options: ["صح", "خطأ"], correct: "خطأ", exp: "العقاب قد يخفي السلوك مؤقتاً أو يولد مشاعر عدائية تجاه المعلم." },
                    { q: "التعلم التجنبي يعتمد على إجراء التعزيز السلبي.", options: ["صح", "خطأ"], correct: "صح", exp: "نعم، المتعلم يتجنب المثير المنفر بالقيام بالاستجابة المطلوبة." },
                    { q: "في جداول التعزيز العشوائية، يتم تقديم المكافأة بطريقة غير متوقعة.", options: ["صح", "خطأ"], correct: "صح", exp: "وهذا ما يجعل السلوك شديد المقاومة للانطفاء (مثل سلوك الصياد)." },
                    { q: "الاستجابة الإجرائية هي الأداة أو الوسيلة التي تمكن المتعلم من تحقيق هدفه.", options: ["صح", "خطأ"], correct: "صح", exp: "لذلك يسمى أحياناً بالاشتراط الوسيلي أو الذرائعي." },
                    { q: "سكينر ركز على المثير الذي يسبق الاستجابة أكثر من النتائج.", options: ["صح", "خطأ"], correct: "خطأ", exp: "سكينر ركز على النتائج (التعزيز) التي تتبع الاستجابة." },
                    { q: "تجزئة المادة إلى وحدات بسيطة يقلل من احتمالية حدوث الخطأ.", options: ["صح", "خطأ"], correct: "صح", exp: "الهدف هو ضمان تحقيق النجاح وتلقي التعزيز الفوري." },
                    { q: "التعلم الثوابي هو الاسم الآخر للتعزيز الإيجابي.", options: ["صح", "خطأ"], correct: "صح", exp: "لأن يتضمن الحصول على ثواب (مثير مرغوب) نتيجة السلوك." },
                    { q: "معظم أنواع السلوك غير السوي هي نتيجة التعلم ويمكن علاجها.", options: ["صح", "خطأ"], correct: "صح", exp: "هذا هو الافتراض الأساسي الذي يقوم عليه العلاج السلوكي." },
                    { q: "التجاهل (عدم الانتباه) لسلوك الطالب المشاغب هو تطبيق لمبدأ التشكيل.", options: ["صح", "خطأ"], correct: "خطأ", exp: "هو تطبيق لمبدأ الانطفاء." },
                    { q: "التعزيز المستمر هو الأفضل للمراحل الأولى من تعلم مهارة جديدة.", options: ["صح", "خطأ"], correct: "صح", exp: "لأنه يثبت الرابطة بسرعة بين الفعل والنتيجة." },
                    { q: "سكينر يرى ضرورة تحديد الأهداف سلوكياً قبل البدء في التدريس.", options: ["صح", "خطأ"], correct: "صح", exp: "الأهداف الإجرائية تمكن المعلم من قياس مدى تحقق التعلم." },
                    { q: "التعلم عند سكينر يسير من المركب إلى البسيط.", options: ["صح", "خطأ"], correct: "خطأ", exp: "يسير من البسيط إلى المركب (تجميع السلوكيات البسيطة لتكوين المركبة)." },
                    { q: "الحرمان من الطعام يؤدي إلى أن يصبح الطعام معززاً أولياً.", options: ["صح", "خطأ"], correct: "صح", exp: "الحرمان يزيد من قيمة المعزز المرتبط بالحاجة البيولوجية." },
                    { q: "الاشتراط الإجرائي لا يتضمن إجبار الاستجابة على الظهور.", options: ["صح", "خطأ"], correct: "صح", exp: "صح، الاستجابة تنبعث تلقائياً من الكائن وليست مستثارة قسرياً." }
                ]
            }
        };

        // متغيرات التحكم في الحالة
        let currentQuizKey = '';
        let currentQuestions = [];
        let currentIndex = 0;
        let score = 0;
        let answered = false;

        // وظائف خلط الأسئلة
        function shuffle(array) {
            for (let i = array.length - 1; i > 0; i--) {
                const j = Math.floor(Math.random() * (i + 1));
                [array[i], array[j]] = [array[j], array[i]];
            }
            return array;
        }

        // بدء اختبار معين
        function startQuiz(key) {
            currentQuizKey = key;
            const data = database[key];
            currentQuestions = shuffle([...data.questions]);
            currentIndex = 0;
            score = 0;
            
            document.getElementById('home-screen').style.display = 'none';
            document.getElementById('quiz-screen').style.display = 'block';
            document.getElementById('quiz-ui').style.display = 'block';
            document.getElementById('result-screen').style.display = 'none';
            document.getElementById('quiz-title-display').innerText = data.title;
            
            renderQuestion();
        }

        // عرض السؤال الحالي
        function renderQuestion() {
            answered = false;
            const q = currentQuestions[currentIndex];
            
            document.getElementById('q-count').innerText = `سؤال ${currentIndex + 1} من ${currentQuestions.length}`;
            document.getElementById('q-text').innerText = q.q;
            document.getElementById('bar').style.width = `${(currentIndex / currentQuestions.length) * 100}%`;
            
            const optionsBox = document.getElementById('options-box');
            optionsBox.innerHTML = '';
            
            const shuffledOptions = shuffle([...q.options]);
            shuffledOptions.forEach(opt => {
                const btn = document.createElement('button');
                btn.className = 'opt-btn';
                btn.innerText = opt;
                btn.onclick = () => validateAnswer(opt, q.correct, btn);
                optionsBox.appendChild(btn);
            });

            document.getElementById('exp-box').style.display = 'none';
            document.getElementById('next-btn').style.display = 'none';
        }

        // التحقق من الإجابة
        function validateAnswer(selected, correct, btn) {
            if (answered) return;
            answered = true;
            
            const q = currentQuestions[currentIndex];
            const allBtns = document.querySelectorAll('.opt-btn');
            
            if (selected === correct) {
                btn.classList.add('correct');
                score++;
            } else {
                btn.classList.add('wrong');
                allBtns.forEach(b => {
                    if (b.innerText === correct) b.classList.add('correct');
                });
            }

            const expBox = document.getElementById('exp-box');
            expBox.innerHTML = `<strong>توضيح Lord Academy:</strong> ${q.exp}`;
            expBox.style.display = 'block';
            document.getElementById('next-btn').style.display = 'block';
            
            allBtns.forEach(b => b.disabled = true);
        }

        // الانتقال للسؤال التالي أو عرض النتائج
        function handleNext() {
            currentIndex++;
            if (currentIndex < currentQuestions.length) {
                renderQuestion();
                window.scrollTo(0, 0);
            } else {
                finishQuiz();
            }
        }

        // إنهاء الاختبار وعرض النتيجة
        function finishQuiz() {
            document.getElementById('quiz-ui').style.display = 'none';
            document.getElementById('result-screen').style.display = 'block';
            document.getElementById('bar').style.width = '100%';
            
            const resCircle = document.getElementById('final-res');
            resCircle.innerText = `${score}/${currentQuestions.length}`;
            
            const percentage = (score / currentQuestions.length) * 100;
            let msg = "";
            if (percentage >= 90) msg = "أداء ملكي مذهل! أنت فخر LoRD Academy. 🌟";
            else if (percentage >= 75) msg = "ممتاز جداً! مستواك قوي وثابت. 🏆";
            else if (percentage >= 50) msg = "جيد، لكنك تحتاج لتركيز أكبر في التفاصيل. 👍";
            else msg = "بذلت جهداً طيباً، راجع المادة مرة أخرى لتقوية روابطك العصبية! 📚";
            
            document.getElementById('res-msg').innerText = msg;
        }

        // العودة للرئيسية
        function returnToHome() {
            document.getElementById('home-screen').style.display = 'flex';
            document.getElementById('quiz-screen').style.display = 'none';
            window.scrollTo(0, 0);
        }
    </script>
