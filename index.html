<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>منصة امتحانات | LoRD Academy</title>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Cairo:wght@400;700;900&display=swap');

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Cairo', sans-serif;
        }

        body {
            background-color: #050505;
            color: #ffffff;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            overflow-x: hidden;
            background-image: radial-gradient(circle at center, #111 0%, #000 100%);
        }

        .container {
            width: 95%;
            max-width: 700px;
            text-align: center;
            position: relative;
        }

        /* الشعار الملكي */
        .logo {
            font-size: 3.5rem;
            font-weight: 900;
            color: #FFD700;
            text-transform: uppercase;
            letter-spacing: 3px;
            margin-bottom: 5px;
            text-shadow: 0 0 10px rgba(255, 215, 0, 0.5), 
                         0 0 20px rgba(255, 215, 0, 0.8), 
                         0 0 30px #FFD700,
                         0 0 40px #FFD700;
            animation: pulse 2s infinite alternate;
        }

        .subtitle {
            color: #d4af37;
            font-size: 1.2rem;
            margin-bottom: 25px;
            font-weight: bold;
        }

        @keyframes pulse {
            0% { text-shadow: 0 0 10px rgba(255, 215, 0, 0.5), 0 0 20px rgba(255, 215, 0, 0.8); transform: scale(1); }
            100% { text-shadow: 0 0 15px rgba(255, 215, 0, 0.8), 0 0 30px #FFD700, 0 0 50px #FFD700; transform: scale(1.02); }
        }

        /* ================= القائمة الرئيسية ================= */
        #main-menu {
            display: flex;
            flex-direction: column;
            gap: 20px;
            align-items: center;
            animation: fadeIn 0.8s;
        }

        .menu-btn {
            background: linear-gradient(145deg, #1a1a1a, #0d0d0d);
            color: #FFD700;
            border: 2px solid #D4AF37;
            padding: 20px;
            border-radius: 15px;
            font-size: 1.4rem;
            font-weight: 900;
            cursor: pointer;
            transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
            width: 100%;
            max-width: 450px;
            box-shadow: 0 5px 15px rgba(0,0,0,0.5);
        }

        .menu-btn:hover {
            transform: translateY(-5px) scale(1.02);
            box-shadow: 0 10px 25px rgba(255, 215, 0, 0.3);
            background: #FFD700;
            color: #000;
        }

        /* ================= واجهة الاختبار ================= */
        #quiz-ui {
            display: none;
        }

        .progress-text {
            color: #f1c40f;
            margin-bottom: 15px;
            font-size: 1.3rem;
            font-weight: bold;
            background: rgba(255, 215, 0, 0.1);
            display: inline-block;
            padding: 5px 20px;
            border-radius: 20px;
            border: 1px solid rgba(255, 215, 0, 0.3);
        }

        .quiz-wrapper {
            position: relative;
            min-height: 400px;
        }

        .quiz-card {
            background: linear-gradient(145deg, #161616, #0a0a0a);
            border: 2px solid #D4AF37;
            border-radius: 20px;
            padding: 35px 25px;
            box-shadow: 0 10px 30px rgba(212, 175, 55, 0.15), inset 0 0 15px rgba(255, 215, 0, 0.05);
            transition: all 0.5s cubic-bezier(0.4, 0, 0.2, 1);
            position: absolute;
            width: 100%;
            left: 0;
            top: 0;
            opacity: 1;
            transform: translateX(0);
        }

        .quiz-card.slide-out {
            opacity: 0;
            transform: translateX(-100px) scale(0.95);
            pointer-events: none;
        }

        .quiz-card.slide-in {
            opacity: 0;
            transform: translateX(100px) scale(0.95);
        }

        .question-type {
            color: #888;
            font-size: 1rem;
            margin-bottom: 10px;
        }

        .question-text {
            font-size: 1.6rem;
            margin-bottom: 30px;
            line-height: 1.6;
            font-weight: 700;
            color: #fff;
        }

        .options-container {
            display: flex;
            flex-direction: column;
            gap: 15px;
        }

        .option-btn {
            background-color: #1a1a1a;
            color: #eee;
            border: 1px solid #444;
            border-radius: 12px;
            padding: 16px;
            font-size: 1.25rem;
            cursor: pointer;
            transition: all 0.3s ease;
            outline: none;
            font-weight: 600;
        }

        .option-btn:hover:not(:disabled) {
            background-color: #2a2a2a;
            border-color: #FFD700;
            color: #FFD700;
            box-shadow: 0 0 15px rgba(255, 215, 0, 0.2);
            transform: translateY(-2px);
        }

        .option-btn.correct {
            background-color: #28a745 !important;
            border-color: #28a745 !important;
            color: white !important;
            box-shadow: 0 0 20px rgba(40, 167, 69, 0.5) !important;
            transform: scale(1.02);
        }

        .option-btn.wrong {
            background-color: #dc3545 !important;
            border-color: #dc3545 !important;
            color: white !important;
            box-shadow: 0 0 20px rgba(220, 53, 69, 0.5) !important;
            animation: shake 0.4s;
        }

        @keyframes shake {
            0%, 100% { transform: translateX(0); }
            25% { transform: translateX(-5px); }
            50% { transform: translateX(5px); }
            75% { transform: translateX(-5px); }
        }

        .option-btn:disabled {
            cursor: not-allowed;
            opacity: 0.8;
        }

        /* ================= شاشة النتيجة ================= */
        #result-screen {
            display: none;
            background: linear-gradient(145deg, #1a1a1a, #0d0d0d);
            border: 2px solid #FFD700;
            border-radius: 20px;
            padding: 50px 30px;
            box-shadow: 0 0 40px rgba(255, 215, 0, 0.3);
            animation: fadeIn 1s forwards;
        }

        @keyframes fadeIn {
            from { opacity: 0; transform: scale(0.9); }
            to { opacity: 1; transform: scale(1); }
        }

        #result-screen h2 {
            color: #FFD700;
            margin-bottom: 20px;
            font-size: 2.5rem;
            text-shadow: 0 0 10px rgba(255, 215, 0, 0.5);
        }

        #result-screen p {
            font-size: 1.8rem;
            margin-bottom: 40px;
        }

        .score-highlight {
            color: #28a745;
            font-size: 2.5rem;
            font-weight: 900;
        }

        .action-btns {
            display: flex;
            gap: 15px;
            justify-content: center;
            flex-wrap: wrap;
        }

        .action-btn {
            background: linear-gradient(to right, #D4AF37, #FFD700);
            color: #000;
            border: none;
            padding: 12px 30px;
            font-size: 1.2rem;
            font-weight: 900;
            border-radius: 10px;
            cursor: pointer;
            transition: all 0.3s;
            box-shadow: 0 0 15px rgba(255, 215, 0, 0.4);
        }
        
        .action-btn.secondary {
            background: #222;
            color: #FFD700;
            border: 1px solid #FFD700;
        }

        .action-btn:hover {
            transform: scale(1.05);
            box-shadow: 0 0 25px rgba(255, 215, 0, 0.6);
        }

        .back-nav {
            margin-top: 20px;
            cursor: pointer;
            color: #888;
            font-weight: bold;
            text-decoration: underline;
            transition: 0.3s;
        }
        .back-nav:hover { color: #FFD700; }

        @media (max-width: 600px) {
            .logo { font-size: 2.5rem; }
            .question-text { font-size: 1.3rem; }
            .option-btn { font-size: 1.1rem; padding: 12px; }
            .quiz-card { padding: 25px 15px; }
            .menu-btn { font-size: 1.2rem; padding: 15px;}
        }
    </style>
</head>
<body>

    <div class="container">
        <div class="logo">LoRD Academy</div>
        <div class="subtitle" id="main-subtitle">منصة امتحانات المفاهيم اللغوية والأدبية</div>
        
        <!-- القائمة الرئيسية -->
        <div id="main-menu">
            <button class="menu-btn" onclick="startQuiz('ch1', 'امتحان الفصل الأول: التواصل اللغوي')">امتحان الفصل الأول</button>
            <button class="menu-btn" onclick="startQuiz('ch2', 'امتحان الفصل الثاني: دورة التعلم والأداء اللغوي')">امتحان الفصل الثاني</button>
            <button class="menu-btn" onclick="startQuiz('ch3', 'امتحان الفصل الثالث: المعاقون سمعياً والوعي الديني')">امتحان الفصل الثالث</button>
        </div>

        <!-- واجهة الاختبار -->
        <div id="quiz-ui">
            <div id="progress-text" class="progress-text">السؤال 1 من 60</div>
            
            <div class="quiz-wrapper">
                <div id="quiz-card" class="quiz-card">
                    <div id="question-type" class="question-type"></div>
                    <div id="question-text" class="question-text">جاري تحميل السؤال...</div>
                    <div id="options-container" class="options-container"></div>
                </div>
            </div>
            
            <div class="back-nav" onclick="showMainMenu()">رجوع للقائمة الرئيسية</div>
        </div>

        <!-- شاشة النتيجة -->
        <div id="result-screen">
            <h2>انتهى الاختبار الملكي!</h2>
            <p>لقد أتممت التحدي، نتيجتك هي:</p>
            <p><span id="score-text" class="score-highlight"></span> من 60</p>
            
            <div class="action-btns">
                <button class="action-btn" onclick="restartCurrentQuiz()">إعادة الاختبار</button>
                <button class="action-btn secondary" onclick="showMainMenu()">القائمة الرئيسية</button>
            </div>
        </div>
    </div>

    <script>
        // جميع الأسئلة مجمعة في كائن واحد مقسم بالفصول (180 سؤال)
        const allQuestions = {
            // ================= أسئلة الفصل الأول =================
            ch1: [
                { type: 'tf', q: 'اللغة العربية هي الأداة الجوهرية للاتصال والمحرك الفاعل في حياة الأفراد والمجتمعات.', opts: ['صح', 'خطأ'], ans: 0 },
                { type: 'tf', q: 'لا تساهم اللغة في بناء شخصية التلميذ فكرياً وروحياً.', opts: ['صح', 'خطأ'], ans: 1 },
                { type: 'tf', q: 'تسعى المدرسة من خلال اللغة إلى تكوين شخصية قادرة على مواجهة مواقف الحياة.', opts: ['صح', 'خطأ'], ans: 0 },
                { type: 'tf', q: 'يعتبر التواصل اللغوي هدفاً ثانوياً لتعليم اللغة العربية.', opts: ['صح', 'خطأ'], ans: 1 },
                { type: 'tf', q: 'عدم تمكن المتعلم من مهارات اللغة الأربعة يحول دون قدرته على التواصل الفعال.', opts: ['صح', 'خطأ'], ans: 0 },
                { type: 'tf', q: 'عرف (عليان) التواصل بأنه التعبير السليم عن المشاعر وتلميحات الآخرين وضبط الانفعالات.', opts: ['صح', 'خطأ'], ans: 0 },
                { type: 'tf', q: 'التواصل الكتابي يعتمد على مهاراتي الاستماع والتحدث.', opts: ['صح', 'خطأ'], ans: 1 },
                { type: 'tf', q: 'فنون اللغة الأربعة (استماع، تحدث، قراءة، كتابة) منفصلة ولا تؤثر في بعضها البعض.', opts: ['صح', 'خطأ'], ans: 1 },
                { type: 'tf', q: 'المستمع الجيد يكون بالضرورة متحدثاً وقارئاً وكاتباً جيداً.', opts: ['صح', 'خطأ'], ans: 0 },
                { type: 'tf', q: 'الاستماع هو المهارة الأولى والأساس الذي تبنى عليه قدرات الفرد اللغوية.', opts: ['صح', 'خطأ'], ans: 0 },
                { type: 'tf', q: 'الإنصات هو أعلى درجات الاستماع ويتطلب التركيز الشديد كاستماع القرآن.', opts: ['صح', 'خطأ'], ans: 0 },
                { type: 'tf', q: 'السماع هو استقبال الأذن للذبذبات الصوتية بانتباه وتركيز شديد.', opts: ['صح', 'خطأ'], ans: 1 },
                { type: 'tf', q: 'من مهارات الاستماع الفرعية التنبؤ بالنتائج وتلخيص النص المسموع.', opts: ['صح', 'خطأ'], ans: 0 },
                { type: 'tf', q: 'التحدث هو قدرة الفرد على التعبير الشفوي عن مشاعره، وهو أكثر المهارات استخداماً.', opts: ['صح', 'خطأ'], ans: 0 },
                { type: 'tf', q: 'من السمات الشخصية للمتحدث الناجح: تدعيم الحديث بالحجج والبراهين والمنطق.', opts: ['صح', 'خطأ'], ans: 1 },
                { type: 'tf', q: 'القراءة الصامتة تعتمد على إدراك المعاني بالنظر مع إخراج صوت منخفض.', opts: ['صح', 'خطأ'], ans: 1 },
                { type: 'tf', q: 'البدء بالقراءة الصامتة لإدراك المعنى قبل الأداء الجهري من أساليب تنمية القراءة.', opts: ['صح', 'خطأ'], ans: 0 },
                { type: 'tf', q: 'الكتابة الإبداعية هي التي تؤدي غرضاً نفعياً كالمراسلات الرسمية والتقارير.', opts: ['صح', 'خطأ'], ans: 1 },
                { type: 'tf', q: 'الكتابة التفسيرية تهدف إلى إيصال المعلومات وشرحها بتركيز على موضوع واحد.', opts: ['صح', 'خطأ'], ans: 0 },
                { type: 'tf', q: 'أكدت دراسة العتيبي أن استخدام "النص التمثيلي" ينمي مهارات التواصل الشفهي والكتابي.', opts: ['صح', 'خطأ'], ans: 0 },
                { type: 'tf', q: 'بدون رد المستقبل على الرسالة، يظل الموقف "اتصالاً" وليس "تواصلاً".', opts: ['صح', 'خطأ'], ans: 0 },
                { type: 'tf', q: 'الرسالة الناجحة تتميز بالتعقيد اللفظي والغموض لإثارة تفكير المستقبل.', opts: ['صح', 'خطأ'], ans: 1 },
                { type: 'tf', q: 'التغذية الراجعة هي التي تجعل نمط التواصل اللغوي دائرياً.', opts: ['صح', 'خطأ'], ans: 0 },
                { type: 'tf', q: 'الاتصال الذاتي هو تفكير الشخص مع نفسه، والمرسل والمستقبل هو الفرد ذاته.', opts: ['صح', 'خطأ'], ans: 0 },
                { type: 'tf', q: 'الاتصال الشخصي هو انتقال الرسالة من متحدث واحد إلى جمهور كبير كالمحاضرة.', opts: ['صح', 'خطأ'], ans: 1 },
                { type: 'tf', q: 'الاتصال الجماهيري يتجاوز الحدود الجغرافية ويتم عبر الوسائل الإلكترونية كالتلفاز.', opts: ['صح', 'خطأ'], ans: 0 },
                { type: 'tf', q: 'الاتصال الثقافي يحدث عند اتصال أشخاص من ثقافات مختلفة ويتطلب وعياً بالاختلافات.', opts: ['صح', 'خطأ'], ans: 0 },
                { type: 'tf', q: 'تمثيل المعلم للقصص وتحويلها لتمثيليات يعيق الملاحظة والتفكير الناقد للتلاميذ.', opts: ['صح', 'خطأ'], ans: 1 },
                { type: 'tf', q: 'مهارات الإرسال في التواصل اللغوي تتمثل في الاستماع والقراءة.', opts: ['صح', 'خطأ'], ans: 1 },
                { type: 'tf', q: 'القراءة الجيدة تعكس تحدثاً جيداً، والتحدث الجيد يعكس استماعاً جيداً في حلقة متكاملة.', opts: ['صح', 'خطأ'], ans: 0 },
                { type: 'mcq', q: 'أركان الاتصال تفرض ضرورة إلمام الفرد بـ .......... مهارات أساسية للغة.', opts: ['ثلاث', 'أربع', 'خمس', 'ست'], ans: 1 },
                { type: 'mcq', q: 'من مهارات التواصل الشفهي:', opts: ['القراءة والكتابة', 'القراءة والاستماع', 'الاستماع والتحدث', 'التحدث والكتابة'], ans: 2 },
                { type: 'mcq', q: 'من مهارات التواصل الكتابي:', opts: ['الاستماع والتحدث', 'القراءة والكتابة', 'القراءة والتحدث', 'الاستماع والكتابة'], ans: 1 },
                { type: 'mcq', q: 'عرف التواصل بأنه عملية ينقل بها الشخص أفكاراً عبر رسائل تصاحبها تعبيرات الوجه والجسم:', opts: ['عاشور 2005', 'داود 2019', 'عليان 2000', 'Diggins 2024'], ans: 3 },
                { type: 'mcq', q: 'عملية تفاعل بين مرسل ومستقبل لتوصيل رسالة عبر قناة مناسبة لإشباع حاجة، هذا تعريف:', opts: ['داود 2019', 'Gang 2011', 'شحاتة 2012', 'Montess 2002'], ans: 0 },
                { type: 'mcq', q: 'التسلسل المهاري الصحيح لاكتساب اللغة هو:', opts: ['قراءة - كتابة - تحدث - استماع', 'استماع - تحدث - قراءة - كتابة', 'تحدث - استماع - كتابة - قراءة', 'كتابة - قراءة - استماع - تحدث'], ans: 1 },
                { type: 'mcq', q: 'استقبال الأذن للذبذبات الصوتية دون انتباه أو تركيز، يسمى:', opts: ['الإنصات', 'الاستماع', 'السماع', 'التواصل الذاتي'], ans: 2 },
                { type: 'mcq', q: 'إرهاف السمع والتركيز الشديد (مثل الاستماع للقرآن) يطلق عليه:', opts: ['السماع', 'الإنصات', 'القراءة الصامتة', 'الاتصال الجماهيري'], ans: 1 },
                { type: 'mcq', q: 'أي مما يلي ليس من مهارات الاستماع الفرعية؟', opts: ['سرد القصة ومراعاة التسلسل', 'التنبؤ بالنتائج', 'إخراج الحروف بدقة وضبط أواخر الكلمات', 'استخلاص معاني الكلمات من السياق'], ans: 2 },
                { type: 'mcq', q: 'النبر، الهمس، عدم السرعة، وإخراج الحروف بدقة، تعتبر من سمات المتحدث الـ:', opts: ['الشخصية', 'الصوتية', 'الاجتماعية', 'العقلية'], ans: 1 },
                { type: 'mcq', q: 'تدعيم الحديث بالحجج والبراهين والمنطق من سمات المتحدث:', opts: ['الاجتماعية', 'الصوتية', 'الشخصية', 'النفسية'], ans: 0 },
                { type: 'mcq', q: 'عملية ذهنية وحركية لتحليل الرموز وتفسيرها وفهم المعنى هي:', opts: ['التحدث', 'الاستماع', 'القراءة', 'الكتابة الإبداعية'], ans: 2 },
                { type: 'mcq', q: 'ترجمة الرموز المكتوبة إلى ألفاظ منطوقة بصوت مسموع هي القراءة:', opts: ['الصامتة', 'الجهرية', 'التحليلية', 'السريعة'], ans: 1 },
                { type: 'mcq', q: 'تعد المفتاح الأساسي لجميع المواد الدراسية والضعف فيها يؤدي للإخفاق الدراسي:', opts: ['القراءة', 'الكتابة الوظيفية', 'الكتابة التفسيرية', 'الاتصال الثقافي'], ans: 0 },
                { type: 'mcq', q: 'الإفصاح عن العواطف وصياغتها فنياً كالمقال والقصة والشعر يسمى كتابة:', opts: ['وظيفية', 'تفسيرية', 'إبداعية', 'إجرائية'], ans: 2 },
                { type: 'mcq', q: 'المراسلات الرسمية والتقارير والإعلانات من أمثلة الكتابة:', opts: ['الإبداعية', 'التفسيرية', 'العاطفية', 'الوظيفية'], ans: 3 },
                { type: 'mcq', q: 'تستخدم في المناهج والملخصات الدراسية لشرح المعلومات والتركيز على موضوع واحد:', opts: ['الكتابة التفسيرية', 'الكتابة الإبداعية', 'الكتابة الوظيفية', 'القراءة الصامتة'], ans: 0 },
                { type: 'mcq', q: 'الركن المبتدئ بالعملية التواصلية ويسعى لإحداث أثر في الطرف الآخر هو:', opts: ['المستقبل', 'المرسل', 'القناة', 'الترميز'], ans: 1 },

                { type: 'mcq', q: 'من العوامل المؤثرة في نمو المفاهيم والتي تتعلق بالتلميذ نفسه:', opts: ['استراتيجيات الاكتساب', 'التغذية الراجعة', 'عدد الأمثلة', 'العمر الزمني والذكاء'], ans: 3 },
                { type: 'mcq', q: 'نموذج يركز على عرض أمثلة (نعم / لا) وتكليف التلاميذ باكتشاف المعيار سراً:', opts: ['كلوز ماير', 'برونر', 'هيلدا تابا', 'دسكنيسون'], ans: 1 },
                { type: 'mcq', q: 'النموذج الذي يركز على مناقشة الأمثلة وتوسيعها لإظهار الخصائص والصفات ثم التحليل والتعريف هو نموذج:', opts: ['دسكنيسون', 'جانيه', 'برونر', 'هيلدا تابا'], ans: 0 },
                { type: 'mcq', q: 'من صعوبات تعلم التربية الإسلامية (الخاصة بالمنهج الدراسي):', opts: ['الفصل الروتيني', 'ضعف المعينات السمعية', 'افتقار الكتب للأنشطة', 'نقص المعلمين'], ans: 2 },
                { type: 'mcq', q: 'إدراك الفرد لنفسه وللبيئة المحيطة به، هو التعريف الاصطلاحي العام لـ:', opts: ['المفهوم', 'الوعي', 'النمو المعرفي', 'الاتزان'], ans: 1 },
                { type: 'mcq', q: '"امتلاك المعلم للسلوك وإدراك جوانبه الإيجابية والسلبية" هو تعريف الوعي عند:', opts: ['حسن شحاته', 'جون سيرل', 'اللقاني والجمل', 'طلعت منصور'], ans: 2 },
                { type: 'mcq', q: 'وظيفة الوعي التي تتمثل في نقل الإرث الثقافي والاتجاهات الأخلاقية من جيل لآخر هي الوظيفة:', opts: ['المعرفية', 'السلوكية', 'النفسية', 'التربوية'], ans: 3 },
                { type: 'mcq', q: 'شرح مصالح الفئات الاجتماعية وتوضيح الأعراف والتقاليد يمثل الوظيفة ......... للوعي.', opts: ['المعرفية', 'التربوية', 'السلوكية', 'الذاتية'], ans: 0 },
                { type: 'mcq', q: 'زيادة الوعي الديني تقلل من المخاوف المرضية والاستجابات الاكتئابية، هذا يوضح علاقة الوعي بـ:', opts: ['الفروق الفردية', 'التعصب', 'الصحة النفسية', 'الإعاقة السمعية'], ans: 2 },
                { type: 'mcq', q: 'أثبتت الدراسات تدني مستوى الوعي الديني لدى الطلاب المعلمين بسبب:', opts: ['التعصب الديني', 'قصور برامج الإعداد', 'صعوبة المناهج', 'كثرة الأنشطة'], ans: 1 },
                { type: 'mcq', q: 'من العوامل التعليمية المؤثرة في عملية اكتساب المفاهيم:', opts: ['الخبرات السابقة', 'نوع الجنس', 'التغذية الراجعة', 'مستوى القلق'], ans: 2 },
                { type: 'mcq', q: 'المفهوم الموحد عند "برونر" يعرف بأنه مجموعة خواص مشتركة، ومثاله في التربية الإسلامية:', opts: ['الجهاد', 'طلب العلم', 'العمل الصالح', 'صلاة الفجر'], ans: 3 },
                { type: 'mcq', q: 'تعريف "اليونسكو" للمفهوم هو:', opts: ['تجريد للعناصر المشتركة', 'فكرة تمثل عناصر تشترك في أمر ما', 'عبارة تستخدم لمجموعة أهداف تشترك بصفات', 'تصور عقلي مجرد لأحداث'], ans: 2 },
                { type: 'mcq', q: '"تغيير لغوي عقلي يطلق بعد تجريد خصائص مشتركة لكائن أو موقف"، هذا تعريف المفهوم لـ:', opts: ['دائرة المعارف', 'إبراهيم محمد عطا', 'كمال الدسوقي', 'رشدي لبيب'], ans: 1 },
                { type: 'mcq', q: 'من الأسس الخاصة بالمعاقين سمعياً عند تعليمهم مفاهيم التربية الإسلامية:', opts: ['البدء بالمجردات دائماً', 'تقليل الصور والوسائل', 'التدرج من البسيط إلى المعقد', 'الاعتماد على النص المكتوب فقط'], ans: 2 },
                { type: 'mcq', q: 'من المشكلات الخاصة (بالإعاقة نفسها) والتي تصعب من تعلم المفاهيم:', opts: ['افتقار الكتب للأنشطة', 'النقل الخاطئ للمواضيع', 'صعوبات اللغة وضعف المعينات السمعية', 'الفصل الروتيني'], ans: 2 }
            ]
        };

        // متغيرات حالة الاختبار
        let activeChapterData = [];
        let activeChapterKey = '';
        let currentQuestionIndex = 0;
        let score = 0;
        let isTransitioning = false;

        // عناصر الواجهة
        const mainMenu = document.getElementById('main-menu');
        const quizUi = document.getElementById('quiz-ui');
        const resultScreen = document.getElementById('result-screen');
        const mainSubtitle = document.getElementById('main-subtitle');
        
        const quizCard = document.getElementById('quiz-card');
        const questionTypeText = document.getElementById('question-type');
        const questionText = document.getElementById('question-text');
        const optionsContainer = document.getElementById('options-container');
        const progressText = document.getElementById('progress-text');
        const scoreText = document.getElementById('score-text');

        // دالة بدء الاختبار
        function startQuiz(chapterKey, chapterTitle) {
            activeChapterKey = chapterKey;
            activeChapterData = allQuestions[chapterKey];
            currentQuestionIndex = 0;
            score = 0;

            mainSubtitle.innerText = chapterTitle;
            
            mainMenu.style.display = 'none';
            resultScreen.style.display = 'none';
            quizUi.style.display = 'block';
            
            loadQuestion();
        }

        // دالة العودة للقائمة الرئيسية
        function showMainMenu() {
            quizUi.style.display = 'none';
            resultScreen.style.display = 'none';
            mainMenu.style.display = 'flex';
            mainSubtitle.innerText = 'منصة امتحانات المفاهيم اللغوية والأدبية';
        }

        // دالة إعادة نفس الاختبار
        function restartCurrentQuiz() {
            let title = '';
            if(activeChapterKey === 'ch1') title = 'امتحان الفصل الأول: التواصل اللغوي';
            if(activeChapterKey === 'ch2') title = 'امتحان الفصل الثاني: دورة التعلم والأداء اللغوي';
            if(activeChapterKey === 'ch3') title = 'امتحان الفصل الثالث: المعاقون سمعياً والوعي الديني';
            startQuiz(activeChapterKey, title);
        }

        function loadQuestion() {
            isTransitioning = false;
            const currentQ = activeChapterData[currentQuestionIndex];
            
            progressText.innerText = `السؤال ${currentQuestionIndex + 1} من ${activeChapterData.length}`;
            questionTypeText.innerText = currentQ.type === 'tf' ? '✅ سؤال صح وخطأ' : '📝 سؤال اختياري';
            questionText.innerText = currentQ.q;
            optionsContainer.innerHTML = '';
            
            currentQ.opts.forEach((option, index) => {
                const btn = document.createElement('button');
                btn.className = 'option-btn';
                btn.innerText = option;
                btn.onclick = () => checkAnswer(index, btn);
                optionsContainer.appendChild(btn);
            });

            quizCard.classList.remove('slide-in', 'slide-out');
            quizCard.offsetHeight; 
            quizCard.style.opacity = 1;
            quizCard.style.transform = 'translateX(0)';
        }

        function checkAnswer(selectedIndex, selectedBtn) {
            if (isTransitioning) return;
            isTransitioning = true;

            const currentQ = activeChapterData[currentQuestionIndex];
            const correctIndex = currentQ.ans;
            const allBtns = optionsContainer.children;

            for (let btn of allBtns) {
                btn.disabled = true;
            }

            if (selectedIndex === correctIndex) {
                selectedBtn.classList.add('correct');
                score++;
            } else {
                selectedBtn.classList.add('wrong');
                allBtns[correctIndex].classList.add('correct'); 
            }

            setTimeout(() => {
                nextQuestion();
            }, 1200);
        }

        function nextQuestion() {
            quizCard.classList.add('slide-out');

            setTimeout(() => {
                currentQuestionIndex++;
                if (currentQuestionIndex < activeChapterData.length) {
                    quizCard.classList.remove('slide-out');
                    quizCard.classList.add('slide-in');
                    loadQuestion();
                } else {
                    showResult();
                }
            }, 400); 
        }

        function showResult() {
            quizUi.style.display = 'none';
            resultScreen.style.display = 'block';
            scoreText.innerText = score;
        }

    </script>
